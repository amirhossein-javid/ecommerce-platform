name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://ecommerce_ci:ecommerce_ci@127.0.0.1:5432/ecommerce_ci
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_SECRET_KEY: django-insecure-ci-only-not-for-production
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ecommerce_ci
          POSTGRES_USER: ecommerce_ci
          POSTGRES_PASSWORD: ecommerce_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecommerce_ci -d ecommerce_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/development.lock.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements/development.lock.txt

      - name: Run Ruff
        run: ruff check .

      - name: Run Django system checks
        run: python manage.py check

      - name: Check migration consistency
        run: |
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python manage.py migrate --check

      - name: Run backend test suite
        run: pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript typecheck from a clean generated state
        run: |
          test ! -e .next
          npm run typecheck

      - name: Run frontend unit tests
        run: npm test

      - name: Build production frontend
        run: npm run build

      - name: Run BFF integration tests
        run: npm run test:integration
