name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://ecommerce_ci:ecommerce_ci@127.0.0.1:5432/ecommerce_ci
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_SECRET_KEY: django-insecure-ci-only-not-for-production
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ecommerce_ci
          POSTGRES_USER: ecommerce_ci
          POSTGRES_PASSWORD: ecommerce_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecommerce_ci -d ecommerce_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/development.lock.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements/development.lock.txt

      - name: Run Ruff
        run: ruff check .

      - name: Check Ruff formatting
        run: ruff format --check .

      - name: Run Django system checks
        run: python manage.py check

      - name: Run production security checks
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          DJANGO_SECRET_KEY: ci-deploy-check-secret-key-A7x9-B4m2-C8q6-R5v1-T9p3-W2n7
          DJANGO_JWT_SIGNING_KEY: ci-deploy-check-jwt-key-K8s4-M2q7-P5v9-X3n6-Z1c8-D4r2
          DJANGO_ALLOWED_HOSTS: ci.example.invalid
          DJANGO_CSRF_TRUSTED_ORIGINS: https://ci.example.invalid
          DJANGO_SECURE_HSTS_SECONDS: "31536000"
          DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: "True"
          DJANGO_SECURE_HSTS_PRELOAD: "True"
        run: python manage.py check --deploy --tag security --fail-level WARNING

      - name: Check migration consistency
        run: |
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python manage.py migrate --check

      - name: Validate OpenAPI schema
        run: python manage.py spectacular --file "${RUNNER_TEMP}/schema.yaml" --validate

      - name: Run backend test suite
        run: pytest

      - name: Install Python audit tool
        run: python -m pip install pip-audit==2.10.1

      - name: Audit production Python dependencies
        run: pip-audit --strict -r requirements/production.lock.txt

      - name: Audit development Python dependencies
        run: pip-audit --strict -r requirements/development.lock.txt

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend runtime dependencies
        run: npm audit --omit=dev --audit-level=low

      - name: Audit frontend development dependencies
        shell: bash
        run: |
          report="${RUNNER_TEMP}/npm-audit.json"
          npm audit --json > "$report" || true
          node - "$report" <<'NODE'
          const fs = require("node:fs");

          const report = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (report.error || !report.metadata?.vulnerabilities) {
            console.error("npm audit did not return a valid vulnerability report.");
            console.error(JSON.stringify(report.error ?? report, null, 2));
            process.exit(1);
          }

          const vulnerabilities = report.vulnerabilities ?? {};
          const names = Object.keys(vulnerabilities).sort();
          if (names.length === 0) {
            console.log("No npm vulnerabilities found.");
            process.exit(0);
          }

          const expectedVia = new Map([
            ["@next/eslint-plugin-next", ["fast-glob"]],
            ["eslint-config-next", ["@next/eslint-plugin-next"]],
            ["fast-glob", ["micromatch"]],
            ["micromatch", ["braces"]],
          ]);
          const expectedNames = [...expectedVia.keys(), "braces"].sort();
          const namesMatch =
            names.length === expectedNames.length &&
            names.every((name, index) => name === expectedNames[index]);
          const bracesVia = vulnerabilities.braces?.via ?? [];
          const advisoryMatches =
            bracesVia.length === 1 &&
            typeof bracesVia[0] === "object" &&
            bracesVia[0].url ===
              "https://github.com/advisories/GHSA-vfj7-8cjw-p6xm";
          const chainMatches = [...expectedVia].every(
            ([name, via]) =>
              JSON.stringify(vulnerabilities[name]?.via ?? []) ===
              JSON.stringify(via),
          );

          if (!namesMatch || !advisoryMatches || !chainMatches) {
            console.error(
              "npm audit found vulnerabilities outside the accepted dev-only braces advisory.",
            );
            console.error(JSON.stringify(vulnerabilities, null, 2));
            process.exit(1);
          }

          console.warn(
            "Accepted temporary dev-only risk: GHSA-vfj7-8cjw-p6xm through eslint-config-next; no patched compatible release is currently available.",
          );
          NODE

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript typecheck from a clean generated state
        run: |
          test ! -e .next
          npm run typecheck

      - name: Run frontend unit tests
        run: npm test

      - name: Build production frontend
        run: npm run build

      - name: Run BFF integration tests
        run: npm run test:integration

  images:
    name: Production images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOCKER_BUILDKIT: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build backend production image
        run: docker build --tag naghsh-e-jahan-backend:ci ./backend

      - name: Build frontend production image
        run: docker build --target production --tag naghsh-e-jahan-frontend:ci ./frontend
